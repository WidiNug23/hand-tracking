<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Tracking - Negative Effect Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 4/3;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        #status {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 10;
        }
    </style>

    <!-- Memuat Library MediaPipe Hands & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="container">
        <div id="status">Memuat Kamera & AI...</div>
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <!-- Hidden Canvas untuk pemrosesan filter negatif -->
    <canvas id="hidden_canvas" style="display:none;"></canvas>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d', { willReadFrequently: true });
        
        const hiddenCanvas = document.getElementById('hidden_canvas');
        const hiddenCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });

        const statusElement = document.getElementById('status');
        const FINGER_TIPS = [4, 8, 12, 16, 20];
        let isRunningAI = false;

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(results => {
            isRunningAI = false; 
            try {
                renderFrame(results);
            } catch (err) {
                console.error("Render error:", err);
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                if (videoElement.readyState >= 2) {
                    if (canvasElement.width !== videoElement.videoWidth || canvasElement.height !== videoElement.videoHeight) {
                        canvasElement.width = videoElement.videoWidth || 640;
                        canvasElement.height = videoElement.videoHeight || 480;
                        hiddenCanvas.width = canvasElement.width;
                        hiddenCanvas.height = canvasElement.height;
                    }

                    if (!isRunningAI) {
                        isRunningAI = true;
                        await hands.send({ image: videoElement }).catch((err) => {
                            console.error("AI send error:", err);
                            isRunningAI = false;
                        });
                    }
                }
            },
            width: 640,
            height: 480
        });

        camera.start()
            .then(() => { statusElement.innerText = "Tunjukkan tangan Anda - Efek Negatif Aktif"; })
            .catch(err => { statusElement.innerText = "Gagal akses kamera: " + err; });

        function renderFrame(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            if (results.image) {
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            }

            let w = canvasElement.width;
            let h = canvasElement.height;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                let pts = [];

                FINGER_TIPS.forEach(tipIdx => {
                    pts.push({
                        x: landmarks[tipIdx].x * w,
                        y: landmarks[tipIdx].y * h
                    });
                });

                // Ambil frame video terbaru ke hidden canvas untuk diproses pikselnya
                hiddenCtx.clearRect(0, 0, hiddenCanvas.width, hiddenCanvas.height);
                hiddenCtx.drawImage(videoElement, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
                let imgData = hiddenCtx.getImageData(0, 0, hiddenCanvas.width, hiddenCanvas.height);
                let data = imgData.data;

                // Terapkan rumus filter NEGATIF (255 - nilai RGB) pada seluruh piksel
                for (let i = 0; i < data.length; i += 4) {
                    data[i]     = 255 - data[i];     // Red
                    data[i + 1] = 255 - data[i + 1]; // Green
                    data[i + 2] = 255 - data[i + 2]; // Blue
                }

                hiddenCtx.putImageData(imgData, 0, 0);

                // Buat kliping area polygon berdasarkan ujung jari tangan
                canvasCtx.save();
                canvasCtx.beginPath();
                pts.forEach((pt, idx) => {
                    if (idx === 0) canvasCtx.moveTo(pt.x, pt.y);
                    else canvasCtx.lineTo(pt.x, pt.y);
                });
                canvasCtx.closePath();
                canvasCtx.clip();

                // Gambar hasil negatif hanya di dalam area polygon tangan
                canvasCtx.drawImage(hiddenCanvas, 0, 0);

                // Berikan garis tepi putih pada polygon
                canvasCtx.strokeStyle = '#FFFFFF';
                canvasCtx.lineWidth = 2;
                canvasCtx.stroke();
                canvasCtx.restore();

                statusElement.innerText = "Status: Efek Negatif Aktif pada Area Tangan";
            } else {
                statusElement.innerText = "Status: Menunggu Tangan Terdeteksi...";
            }

            canvasCtx.restore();
        }
    </script>
</body>
</html>
