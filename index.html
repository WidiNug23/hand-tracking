<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hand Tracking & Comet Trail</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 4 / 3;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            z-index: 10;
        }
    </style>

    <!-- Memuat MediaPipe Tasks Vision dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/vision_bundle.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
        <div id="status">Menghubungkan ke AI Server...</div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d', { alpha: false });
        const statusElement = document.getElementById('status');

        let handLandmarker = undefined;
        let lastVideoTime = -1;
        let latestResults = null;
        let isDetecting = false;

        const FINGER_TIPS = [4, 8, 12, 16, 20];
        let trailLeft = Array.from({length: 5}, () => []);
        let trailRight = Array.from({length: 5}, () => []);

        const COLORS = [
            {r: 255, g: 0, b: 0},    // Merah
            {r: 0, g: 0, b: 255},    // Biru
            {r: 0, g: 255, b: 255},  // Kuning
            {r: 0, g: 255, b: 0},    // Hijau
        ];

        async function initializeHandLandmarker() {
            try {
                statusElement.innerText = "Mengunduh Komponen WASM...";
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
                );
                
                statusElement.innerText = "Mengunduh Model AI (Hand Landmarker)...";
                handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                        delegate: "CPU"
                    },
                    runningMode: "VIDEO",
                    numHands: 2
                });
                
                statusElement.innerText = "Model Siap. Membuka Kamera...";
                startWebcam();
            } catch (error) {
                statusElement.innerText = "Gagal memuat AI! Cek koneksi internet.";
                console.error("Detail Error:", error);
            }
        }

        function startWebcam() {
            navigator.mediaDevices.getUserMedia({ 
                video: { width: 480, height: 360 } 
            })
            .then((stream) => {
                videoElement.srcObject = stream;
                videoElement.onloadedmetadata = () => {
                    statusElement.innerText = "Kamera Aktif. Menunggu Tangan...";
                    requestAnimationFrame(renderLoop);
                };
            })
            .catch(err => {
                statusElement.innerText = "Gagal mengakses kamera! Berikan izin kamera.";
                console.error(err);
            });
        }

        function renderLoop() {
            if (canvasElement.width !== videoElement.videoWidth || canvasElement.height !== videoElement.videoHeight) {
                canvasElement.width = videoElement.videoWidth || 480;
                canvasElement.height = videoElement.videoHeight || 360;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            if (videoElement.readyState === videoElement.HAVE_ENOUGH_DATA) {
                canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);

                if (handLandmarker && videoElement.currentTime !== lastVideoTime && !isDetecting) {
                    lastVideoTime = videoElement.currentTime;
                    isDetecting = true;
                    
                    try {
                        let startTimeMs = performance.now();
                        latestResults = handLandmarker.detectForVideo(videoElement, startTimeMs);
                    } catch (e) {
                        console.error(e);
                    }
                    isDetecting = false;
                }
            }

            let results = latestResults;
            let numHands = (results && results.landmarks) ? results.landmarks.length : 0;
            let smoothLeft = {};
            let smoothRight = {};

            if (numHands > 0) {
                statusElement.innerText = numHands === 1 ? "Mode: Satu Tangan" : "Mode: Dua Tangan (4 Sisi)";
                
                results.landmarks.forEach((landmarks, index) => {
                    let handedness = results.handednesses[index][0].categoryName;
                    let actualHand = handedness === "Left" ? "Right" : "Left";

                    let fingertipDict = {};
                    FINGER_TIPS.forEach((tipIdx, i) => {
                        let x = landmarks[tipIdx].x * canvasElement.width;
                        let y = landmarks[tipIdx].y * canvasElement.height;
                        fingertipDict[i] = {x, y};

                        if (actualHand === "Left") {
                            trailLeft[i].unshift({x, y});
                            if (trailLeft[i].length > 10) trailLeft[i].pop();
                        } else {
                            trailRight[i].unshift({x, y});
                            if (trailRight[i].length > 10) trailRight[i].pop();
                        }
                    });

                    if (actualHand === "Left") smoothLeft = fingertipDict;
                    else smoothRight = fingertipDict;
                });
            } else {
                statusElement.innerText = "Menunggu Tangan...";
                for(let i=0; i<5; i++) {
                    trailLeft[i] = [];
                    trailRight[i] = [];
                }
            }

            let tipColors = {};
            if (Object.keys(smoothLeft).length > 0 && Object.keys(smoothRight).length > 0) {
                let sidePalette = [COLORS[0], COLORS[1], COLORS[2], COLORS[3]];
                
                for (let i = 0; i < 4; i++) {
                    let pL1 = smoothLeft[i];
                    let pL2 = smoothLeft[i+1];
                    let pR2 = smoothRight[i+1];
                    let pR1 = smoothRight[i];

                    if (pL1 && pL2 && pR2 && pR1) {
                        let color = sidePalette[i];
                        tipColors[i] = color;
                        tipColors[i+1] = color;

                        canvasCtx.beginPath();
                        canvasCtx.moveTo(pL1.x, pL1.y);
                        canvasCtx.lineTo(pL2.x, pL2.y);
                        canvasCtx.lineTo(pR2.x, pR2.y);
                        canvasCtx.lineTo(pR1.x, pR1.y);
                        canvasCtx.closePath();

                        canvasCtx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, 0.35)`;
                        canvasCtx.fill();
                        canvasCtx.strokeStyle = "white";
                        canvasCtx.lineWidth = 1.5;
                        canvasCtx.stroke();
                    }
                }
            }

            function drawTrails(trailArray) {
                trailArray.forEach((history, tipIdx) => {
                    if (history.length < 2) return;
                    let color = tipColors[tipIdx] || {r: 0, g: 255, b: 255};

                    for (let i = 0; i < history.length - 1; i++) {
                        let progress = i / history.length;
                        let alpha = 0.8 * (1.0 - progress);
                        let thickness = Math.max(1, 4 * (1.0 - progress));

                        canvasCtx.beginPath();
                        canvasCtx.moveTo(history[i].x, history[i].y);
                        canvasCtx.lineTo(history[i+1].x, history[i+1].y);
                        canvasCtx.strokeStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`;
                        canvasCtx.lineWidth = thickness;
                        canvasCtx.stroke();
                    }
                });
            }

            drawTrails(trailLeft);
            drawTrails(trailRight);

            canvasCtx.restore();
            requestAnimationFrame(renderLoop);
        }

        initializeHandLandmarker();
    </script>
</body>
</html>
