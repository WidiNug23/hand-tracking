<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Tracking - Pure Negative Effect</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #container {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Efek cermin webcam */
        }
        #status {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ffcc;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 10;
            border: 1px solid #00ffcc;
        }
    </style>

    <!-- Library MediaPipe Hands & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="container">
        <div id="status">Memuat Kamera...</div>
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusElement = document.getElementById('status');
        
        const FINGER_TIPS = [4, 8, 12, 16, 20];
        let isRunningAI = false;

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(results => {
            isRunningAI = false;
            renderFrame(results);
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                if (videoElement.readyState >= 2) {
                    if (canvasElement.width !== videoElement.videoWidth || canvasElement.height !== videoElement.videoHeight) {
                        canvasElement.width = videoElement.videoWidth || 640;
                        canvasElement.height = videoElement.videoHeight || 480;
                    }

                    if (!isRunningAI) {
                        isRunningAI = true;
                        await hands.send({ image: videoElement }).catch(() => {
                            isRunningAI = false;
                        });
                    }
                }
            },
            width: 640,
            height: 480
        });

        camera.start()
            .then(() => { statusElement.innerText = "Kamera Aktif - Tunjukkan Tangan Anda"; })
            .catch(err => { statusElement.innerText = "Gagal Akses Kamera: " + err; });

        function renderFrame(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // 1. Gambar video normal di background
            if (results.image) {
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            }

            let w = canvasElement.width;
            let h = canvasElement.height;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                let pts = [];

                FINGER_TIPS.forEach(tipIdx => {
                    pts.push({
                        x: landmarks[tipIdx].x * w,
                        y: landmarks[tipIdx].y * h
                    });
                });

                // 2. Buat area kliping (polygon) berdasarkan ujung-ujung jari
                canvasCtx.save();
                canvasCtx.beginPath();
                pts.forEach((pt, idx) => {
                    if (idx === 0) canvasCtx.moveTo(pt.x, pt.y);
                    else canvasCtx.lineTo(pt.x, pt.y);
                });
                canvasCtx.closePath();
                canvasCtx.clip();

                // 3. Terapkan filter NEGATIF menggunakan globalCompositeOperation (Invert warna video)
                canvasCtx.globalCompositeOperation = 'difference';
                canvasCtx.fillStyle = 'white';
                canvasCtx.fillRect(0, 0, w, h);

                // Timpa kembali video di dalam area kliping agar warna negatifnya terisolasi sempurna di tangan
                canvasCtx.globalCompositeOperation = 'source-over';
                canvasCtx.drawImage(videoElement, 0, 0, w, h);
                
                canvasCtx.restore();

                // 4. Beri garis tepi agar bentuk area polygon tangan terlihat jelas
                canvasCtx.beginPath();
                pts.forEach((pt, idx) => {
                    if (idx === 0) canvasCtx.moveTo(pt.x, pt.y);
                    else canvasCtx.lineTo(pt.x, pt.y);
                });
                canvasCtx.closePath();
                canvasCtx.strokeStyle = '#00ffcc';
                canvasCtx.lineWidth = 2;
                canvasCtx.stroke();

                statusElement.innerText = "STATUS: Efek Negatif Berhasil Aktif!";
            } else {
                statusElement.innerText = "Menunggu Tangan...";
            }

            canvasCtx.restore();
        }
    </script>
</body>
</html>
