<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Geometry & Smooth Comet (Python Sync)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 4/3;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Efek cermin webcam */
        }
        #status {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.3);
        }
    </style>

    <!-- Memuat Library MediaPipe Hands & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="container">
        <div id="status">Memuat Kamera & AI...</div>
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <!-- Hidden Canvas untuk pemrosesan piksel efek (Negatif, Mono, Sepia, Bright) -->
    <canvas id="hidden_canvas" style="display:none;"></canvas>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d', { willReadFrequently: true });
        
        const hiddenCanvas = document.getElementById('hidden_canvas');
        const hiddenCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });

        const statusElement = document.getElementById('status');

        const FINGER_TIPS = [4, 8, 12, 16, 20]; // [Jempol, Telunjuk, Tengah, Manis, Kelingking]
        
        // Smoothing & State Variabel (Sinkron dengan Python)
        let smoothLeft = {};
        let smoothRight = {};
        let handVelocity = 0.0;
        const ALPHA = 0.6;

        let colorIndex = 0;
        let effectIndex = 0;
        let isFistedPrev = false;
        let prevAvgCenter = null;
        let isRunningAI = false;

        // Palet Warna (Format RGB untuk manipulasi piksel JavaScript)
        const COLORS = [
            {r: 0,   g: 0,   b: 255, name: "Merah"},
            {r: 255, g: 0,   b: 0,   name: "Biru"},
            {r: 0,   g: 255, b: 255, name: "Kuning"},
            {r: 0,   g: 255, b: 0,   name: "Hijau"},
            {r: 255, g: 0,   b: 255, name: "Magenta"},
            {r: 255, g: 128, b: 0,   name: "Oranye"}
        ];

        const EFFECT_MODES = ['normal', 'mono', 'negative', 'sepia', 'bright'];

        // Riwayat komet (maksimal 15 titik per ujung jari)
        let trailHistoryLeft = {0: [], 1: [], 2: [], 3: [], 4: []};
        let trailHistoryRight = {0: [], 1: [], 2: [], 3: [], 4: []};

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(results => {
            isRunningAI = false;
            try {
                renderFrame(results);
            } catch (err) {
                console.error("Render error:", err);
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                if (videoElement.readyState >= 2) {
                    if (canvasElement.width !== videoElement.videoWidth || canvasElement.height !== videoElement.videoHeight) {
                        canvasElement.width = videoElement.videoWidth || 640;
                        canvasElement.height = videoElement.videoHeight || 480;
                        hiddenCanvas.width = canvasElement.width;
                        hiddenCanvas.height = canvasElement.height;
                    }

                    if (!isRunningAI) {
                        isRunningAI = true;
                        await hands.send({ image: videoElement }).catch(() => {
                            isRunningAI = false;
                        });
                    }
                }
            },
            width: 640,
            height: 480
        });

        camera.start()
            .then(() => { statusElement.innerText = "Kamera Aktif - Silakan Tunjukkan Tangan"; })
            .catch(err => { statusElement.innerText = "Gagal Akses Kamera: " + err; });

        // Fungsi EMA Smoothing
        function applySmoothing(currentDict, smoothDict) {
            let updatedDict = {};
            for (let i in currentDict) {
                let curr = currentDict[i];
                if (smoothDict[i]) {
                    let prev = smoothDict[i];
                    let smoothX = Math.round(ALPHA * curr.x + (1 - ALPHA) * prev.x);
                    let smoothY = Math.round(ALPHA * curr.y + (1 - ALPHA) * prev.y);
                    updatedDict[i] = {x: smoothX, y: smoothY};
                } else {
                    updatedDict[i] = {x: curr.x, y: curr.y};
                }
            }
            return updatedDict;
        }

        // Cek Kepalan Tangan
        function checkIsFisted(landmarks, w, h) {
            let wrist = {x: landmarks[0].x * w, y: landmarks[0].y * h};
            let distances = [];
            FINGER_TIPS.forEach(tipIdx => {
                let tip = {x: landmarks[tipIdx].x * w, y: landmarks[tipIdx].y * h};
                distances.push(Math.hypot(tip.x - wrist.x, tip.y - wrist.y));
            });
            let avgDist = distances.reduce((a, b) => a + b, 0) / distances.length;
            return avgDist < 100.0;
        }

        // Efek Gelombang Motion
        function applyMotionWaveEffect(ptsList, velocity, timeVal) {
            let amplitude = Math.min(Math.max(velocity * 0.4, 0.0), 12.0);
            if (amplitude < 0.5) return ptsList;

            return ptsList.map((pt, idx) => {
                let offsetX = Math.round(amplitude * Math.sin(timeVal * 12 + idx * 1.5));
                let offsetY = Math.round(amplitude * Math.cos(timeVal * 12 + idx * 1.5));
                return {x: pt.x + offsetX, y: pt.y + offsetY};
            });
        }

        // Penerapan Efek Patch (Mono, Negative, Sepia, Bright) pada ImageData
        function applyPatchEffect(effectType, tintColor, w, h) {
            hiddenCtx.clearRect(0, 0, w, h);
            hiddenCtx.drawImage(videoElement, 0, 0, w, h);
            let imgData = hiddenCtx.getImageData(0, 0, w, h);
            let data = imgData.data;

            for (let i = 0; i < data.length; i += 4) {
                let r = data[i], g = data[i+1], b = data[i+2];

                if (effectType === 'mono') {
                    let gray = 0.299 * r + 0.587 * g + 0.114 * b;
                    r = gray; g = gray; b = gray;
                } else if (effectType === 'negative') {
                    r = 255 - r;
                    g = 255 - g;
                    b = 255 - b;
                } else if (effectType === 'sepia') {
                    let tr = (r * 0.393) + (g * 0.769) + (b * 0.189);
                    let tg = (r * 0.349) + (g * 0.686) + (b * 0.168);
                    let tb = (r * 0.272) + (g * 0.534) + (b * 0.131);
                    r = Math.min(255, tr); g = Math.min(255, tg); b = Math.min(255, tb);
                } else if (effectType === 'bright') {
                    r = Math.min(255, r * 1.3 + 25);
                    g = Math.min(255, g * 1.3 + 25);
                    b = Math.min(255, b * 1.3 + 25);
                }

                // Weighted Blending dengan Tint Color
                data[i]   = r * 0.75 + tintColor.r * 0.25;
                data[i+1] = g * 0.75 + tintColor.g * 0.25;
                data[i+2] = b * 0.75 + tintColor.b * 0.25;
            }

            hiddenCtx.putImageData(imgData, 0, 0);
        }

        // Menggambar Ekor Komet
        function drawSmoothCometTrails(trailHistory, tipToColorMap) {
            for (let tipIdx in trailHistory) {
                let points = trailHistory[tipIdx];
                if (points.length < 3) continue;

                let trailColor = tipToColorMap[tipIdx] || {r: 0, g: 255, b: 255};
                let numPts = points.length;

                for (let i = 0; i < numPts - 1; i++) {
                    let pt1 = points[i];
                    let pt2 = points[i+1];
                    let progress = i / (numPts - 1);
                    let alpha = 0.7 * (1.0 - progress);
                    let thickness = Math.max(1, 6 * (1.0 - progress));

                    canvasCtx.beginPath();
                    canvasCtx.moveTo(pt1.x, pt1.y);
                    canvasCtx.lineTo(pt2.x, pt2.y);
                    canvasCtx.strokeStyle = `rgba(${trailColor.r}, ${trailColor.g}, ${trailColor.b}, ${alpha})`;
                    canvasCtx.lineWidth = thickness;
                    canvasCtx.lineCap = 'round';
                    canvasCtx.stroke();

                    if (i === 0) {
                        canvasCtx.beginPath();
                        canvasCtx.arc(pt1.x, pt1.y, 4, 0, 2 * Math.PI);
                        canvasCtx.fillStyle = '#FFFFFF';
                        canvasCtx.fill();
                    }
                }
            }
        }

        function renderFrame(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.image) {
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            }

            let w = canvasElement.width;
            let h = canvasElement.height;

            let currentLeft = {};
            let currentRight = {};
            let isCurrentFisted = false;
            let numHandsDetected = 0;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                numHandsDetected = results.multiHandLandmarks.length;

                for (let idx = 0; idx < numHandsDetected; idx++) {
                    let handLandmarks = results.multiHandLandmarks[idx];
                    let handedness = results.multiHandedness[idx].classification[0].label;
                    // Mirroring logic
                    let actualHand = (handedness === "Left") ? "Right" : "Left";

                    if (numHandsDetected === 1) {
                        isCurrentFisted = checkIsFisted(handLandmarks, w, h);
                    }

                    let fingertipDict = {};
                    FINGER_TIPS.forEach((tipIdx, i) => {
                        let cx = Math.round(handLandmarks[tipIdx].x * w);
                        let cy = Math.round(handLandmarks[tipIdx].y * h);
                        fingertipDict[i] = {x: cx, y: cy};

                        if (actualHand === "Left") {
                            trailHistoryLeft[i].unshift({x: cx, y: cy});
                            if (trailHistoryLeft[i].length > 15) trailHistoryLeft[i].pop();
                        } else {
                            trailHistoryRight[i].unshift({x: cx, y: cy});
                            if (trailHistoryRight[i].length > 15) trailHistoryRight[i].pop();
                        }
                    });

                    if (actualHand === "Left") currentLeft = fingertipDict;
                    else currentRight = fingertipDict;
                }
            } else {
                for (let i = 0; i < 5; i++) {
                    trailHistoryLeft[i] = [];
                    trailHistoryRight[i] = [];
                }
            }

            // Logika Kepalan Tangan untuk Ganti Warna & Efek Manual
            if (numHandsDetected === 1 && isCurrentFisted && !isFistedPrev) {
                colorIndex = (colorIndex + 1) % COLORS.length;
                effectIndex = (effectIndex + 1) % EFFECT_MODES.length;
            }
            isFistedPrev = isCurrentFisted;

            smoothLeft = applySmoothing(currentLeft, smoothLeft);
            smoothRight = applySmoothing(currentRight, smoothRight);
            if (Object.keys(currentLeft).length === 0) smoothLeft = {};
            if (Object.keys(currentRight).length === 0) smoothRight = {};

            // Hitung Kecepatan Tangan untuk Gelombang
            let currentCenters = [];
            if (Object.keys(smoothLeft).length > 0) {
                let avgX = Object.values(smoothLeft).reduce((s, p) => s + p.x, 0) / 5;
                let avgY = Object.values(smoothLeft).reduce((s, p) => s + p.y, 0) / 5;
                currentCenters.push({x: avgX, y: avgY});
            }
            if (Object.keys(smoothRight).length > 0) {
                let avgX = Object.values(smoothRight).reduce((s, p) => s + p.x, 0) / 5;
                let avgY = Object.values(smoothRight).reduce((s, p) => s + p.y, 0) / 5;
                currentCenters.push({x: avgX, y: avgY});
            }

            if (currentCenters.length > 0) {
                let currAvgCenter = {
                    x: currentCenters.reduce((s, c) => s + c.x, 0) / currentCenters.length,
                    y: currentCenters.reduce((s, c) => s + c.y, 0) / currentCenters.length
                };
                if (prevAvgCenter) {
                    handVelocity = Math.hypot(currAvgCenter.x - prevAvgCenter.x, currAvgCenter.y - prevAvgCenter.y);
                }
                prevAvgCenter = currAvgCenter;
            } else {
                handVelocity = 0.0;
            }

            let tNow = performance.now() / 1000;
            let tipToColorMap = {};
            let modeDesc = "Menunggu Tangan...";

            let activeHandData = null;
            if (Object.keys(smoothLeft).length > 0 && Object.keys(smoothRight).length === 0) {
                activeHandData = smoothLeft;
            } else if (Object.keys(smoothRight).length > 0 && Object.keys(smoothLeft).length === 0) {
                activeHandData = smoothRight;
            }

            // --- SKENARIO A: SATU TANGAN AKTIF ---
            if (activeHandData) {
                let activeColor = COLORS[colorIndex];
                let activeEffect = EFFECT_MODES[effectIndex];
                modeDesc = `Satu Tangan | Warna: ${colorIndex+1} | Efek: ${activeEffect.toUpperCase()}`;

                for (let i in activeHandData) {
                    tipToColorMap[i] = activeColor;
                }

                let sortedIndices = Object.keys(activeHandData).map(Number).sort((a,b) => a - b);
                let ptsList = sortedIndices.map(i => activeHandData[i]);

                if (ptsList.length >= 3) {
                    let wavyPts = applyMotionWaveEffect(ptsList, handVelocity, tNow);
                    
                    applyPatchEffect(activeEffect, activeColor, w, h);

                    canvasCtx.save();
                    canvasCtx.beginPath();
                    wavyPts.forEach((pt, idx) => {
                        if (idx === 0) canvasCtx.moveTo(pt.x, pt.y);
                        else canvasCtx.lineTo(pt.x, pt.y);
                    });
                    canvasCtx.closePath();
                    canvasCtx.clip();

                    canvasCtx.drawImage(hiddenCanvas, 0, 0);
                    canvasCtx.restore();

                    // Garis tepi polygon
                    canvasCtx.beginPath();
                    wavyPts.forEach((pt, idx) => {
                        if (idx === 0) canvasCtx.moveTo(pt.x, pt.y);
                        else canvasCtx.lineTo(pt.x, pt.y);
                    });
                    canvasCtx.closePath();
                    canvasCtx.strokeStyle = '#FFFFFF';
                    canvasCtx.lineWidth = 1;
                    canvasCtx.stroke();
                }
            } 
            // --- SKENARIO B: DUA TANGAN AKTIF (4 Sisi Multi-Effect) ---
            else if (Object.keys(smoothLeft).length > 0 && Object.keys(smoothRight).length > 0) {
                modeDesc = "Dua Tangan (Multi-Color & Multi-Effect 4 Sisi)";
                let availableIndices = [0, 1, 2, 3, 4].filter(i => smoothLeft[i] && smoothRight[i]);

                let sidePalette = [
                    {color: COLORS[0], effect: 'mono'},
                    {color: COLORS[1], effect: 'negative'},
                    {color: COLORS[2], effect: 'sepia'},
                    {color: COLORS[3], effect: 'bright'}
                ];

                if (availableIndices.length >= 2) {
                    for (let idx = 0; idx < availableIndices.length - 1; idx++) {
                        let i1 = availableIndices[idx];
                        let i2 = availableIndices[idx + 1];

                        if (smoothLeft[i1] && smoothLeft[i2] && smoothRight[i1] && smoothRight[i2]) {
                            let quadRaw = [
                                smoothLeft[i1],
                                smoothLeft[i2],
                                smoothRight[i2],
                                smoothRight[i1]
                            ];
                            let wavyQuad = applyMotionWaveEffect(quadRaw, handVelocity, tNow + idx * 0.2);
                            let sideStyle = sidePalette[idx % sidePalette.length];

                            tipToColorMap[i1] = sideStyle.color;
                            tipToColorMap[i2] = sideStyle.color;

                            applyPatchEffect(sideStyle.effect, sideStyle.color, w, h);

                            canvasCtx.save();
                            canvasCtx.beginPath();
                            wavyQuad.forEach((pt, pIdx) => {
                                if (pIdx === 0) canvasCtx.moveTo(pt.x, pt.y);
                                else canvasCtx.lineTo(pt.x, pt.y);
                            });
                            canvasCtx.closePath();
                            canvasCtx.clip();

                            canvasCtx.drawImage(hiddenCanvas, 0, 0);
                            canvasCtx.restore();

                            canvasCtx.beginPath();
                            wavyQuad.forEach((pt, pIdx) => {
                                if (pIdx === 0) canvasCtx.moveTo(pt.x, pt.y);
                                else canvasCtx.lineTo(pt.x, pt.y);
                            });
                            canvasCtx.closePath();
                            canvasCtx.strokeStyle = '#FFFFFF';
                            canvasCtx.lineWidth = 1;
                            canvasCtx.stroke();
                        }
                    }
                }
            }

            // Gambar Ekor Komet Halus
            drawSmoothCometTrails(trailHistoryLeft, tipToColorMap);
            drawSmoothCometTrails(trailHistoryRight, tipToColorMap);

            // Teks Status
            statusElement.innerText = modeDesc;
            canvasCtx.restore();
        }
    </script>
</body>
</html>
