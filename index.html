<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Geometry & Smooth Comet (Fixed)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 4/3;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        #status {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 10;
        }
    </style>

    <!-- Memuat Library MediaPipe Hands & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="container">
        <div id="status">Memuat Kamera & AI...</div>
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusElement = document.getElementById('status');

        const FINGER_TIPS = [4, 8, 12, 16, 20];
        
        let trailHistoryLeft = {0: [], 1: [], 2: [], 3: [], 4: []};
        let trailHistoryRight = {0: [], 1: [], 2: [], 3: [], 4: []};
        let isRunningAI = false;

        const hands = new Hands({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1, // Ditingkatkan ke 1 agar deteksi lebih stabil
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(results => {
            isRunningAI = false; 
            try {
                renderFrame(results);
            } catch (err) {
                console.error("Render error:", err);
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                if (videoElement.readyState >= 2) {
                    if (canvasElement.width !== videoElement.videoWidth || canvasElement.height !== videoElement.videoHeight) {
                        canvasElement.width = videoElement.videoWidth || 640;
                        canvasElement.height = videoElement.videoHeight || 480;
                    }

                    if (!isRunningAI) {
                        isRunningAI = true;
                        await hands.send({ image: videoElement }).catch((err) => {
                            console.error("AI send error:", err);
                            isRunningAI = false;
                        });
                    }
                }
            },
            width: 640,
            height: 480
        });

        camera.start()
            .then(() => {
                statusElement.innerText = "Arahkan tangan ke kamera...";
            })
            .catch(err => {
                statusElement.innerText = "Gagal akses kamera: " + err;
            });

        function renderFrame(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            if (results.image) {
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            }

            let landmarksLeft = null;
            let landmarksRight = null;

            if (results.multiHandLandmarks && results.multiHandedness && results.multiHandLandmarks.length > 0) {
                for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                    const rawLabel = results.multiHandedness[i].classification[0].label;
                    // Dibalik agar sesuai dengan tampilan video yang menggunakan scaleX(-1) (cermin)
                    const handLabel = rawLabel === 'Left' ? 'Right' : 'Left';
                    const landmarks = results.multiHandLandmarks[i];

                    let tipDict = {};
                    FINGER_TIPS.forEach((tipIdx, idx) => {
                        const x = landmarks[tipIdx].x * canvasElement.width;
                        const y = landmarks[tipIdx].y * canvasElement.height;
                        tipDict[idx] = {x, y};

                        if (handLabel === 'Left') {
                            if (!trailHistoryLeft[idx]) trailHistoryLeft[idx] = [];
                            trailHistoryLeft[idx].unshift({x, y});
                            if (trailHistoryLeft[idx].length > 15) trailHistoryLeft[idx].pop();
                        } else {
                            if (!trailHistoryRight[idx]) trailHistoryRight[idx] = [];
                            trailHistoryRight[idx].unshift({x, y});
                            if (trailHistoryRight[idx].length > 15) trailHistoryRight[idx].pop();
                        }
                    });

                    if (handLabel === 'Left') landmarksLeft = tipDict;
                    else landmarksRight = tipDict;
                }
            } else {
                for (let i in trailHistoryLeft) trailHistoryLeft[i] = [];
                for (let i in trailHistoryRight) trailHistoryRight[i] = [];
            }

            // Logika Geometri Dua Tangan
            if (landmarksLeft && landmarksRight) {
                statusElement.innerText = "Dua Tangan Aktif (Multi-Color 4 Sisi)";
                let indices = [0, 1, 2, 3, 4];
                let sideColors = [
                    'rgba(0, 0, 255, 0.4)',    
                    'rgba(255, 0, 0, 0.4)',    
                    'rgba(0, 255, 255, 0.4)',  
                    'rgba(0, 255, 0, 0.4)'     
                ];

                for (let i = 0; i < indices.length - 1; i++) {
                    let i1 = indices[i], i2 = indices[i+1];
                    if (landmarksLeft[i1] && landmarksLeft[i2] && landmarksRight[i1] && landmarksRight[i2]) {
                        canvasCtx.beginPath();
                        canvasCtx.moveTo(landmarksLeft[i1].x, landmarksLeft[i1].y);
                        canvasCtx.lineTo(landmarksLeft[i2].x, landmarksLeft[i2].y);
                        canvasCtx.lineTo(landmarksRight[i2].x, landmarksRight[i2].y);
                        canvasCtx.lineTo(landmarksRight[i1].x, landmarksRight[i1].y);
                        canvasCtx.closePath();
                        
                        canvasCtx.fillStyle = sideColors[i % sideColors.length];
                        canvasCtx.fill();
                        canvasCtx.strokeStyle = 'white';
                        canvasCtx.lineWidth = 1.5;
                        canvasCtx.stroke();
                    }
                }
            } 
            // Logika Geometri Satu Tangan
            else if (landmarksLeft || landmarksRight) {
                statusElement.innerText = "Satu Tangan Aktif";
                let hand = landmarksLeft || landmarksRight;
                
                canvasCtx.beginPath();
                Object.keys(hand).sort().forEach((k, idx) => {
                    let pt = hand[k];
                    if (idx === 0) canvasCtx.moveTo(pt.x, pt.y);
                    else canvasCtx.lineTo(pt.x, pt.y);
                });
                canvasCtx.closePath();
                
                canvasCtx.fillStyle = 'rgba(255, 0, 255, 0.4)';
                canvasCtx.fill();
                canvasCtx.strokeStyle = 'white';
                canvasCtx.lineWidth = 1.5;
                canvasCtx.stroke();
            } else {
                statusElement.innerText = "Arahkan tangan ke kamera...";
            }

            drawSmoothCometTrails(trailHistoryLeft);
            drawSmoothCometTrails(trailHistoryRight);

            canvasCtx.restore();
        }

        function drawSmoothCometTrails(historyDict) {
            for (let idx in historyDict) {
                let pts = historyDict[idx];
                if (pts.length < 3) continue;

                for (let i = 0; i < pts.length - 1; i++) {
                    let progress = i / pts.length;
                    let alpha = 0.8 * (1.0 - progress);
                    let thickness = Math.max(1, 6 * (1.0 - progress));

                    canvasCtx.beginPath();
                    canvasCtx.moveTo(pts[i].x, pts[i].y);
                    canvasCtx.lineTo(pts[i+1].x, pts[i+1].y);
                    canvasCtx.strokeStyle = `rgba(0, 255, 255, ${alpha})`;
                    canvasCtx.lineWidth = thickness;
                    canvasCtx.lineCap = 'round';
                    canvasCtx.stroke();

                    if (i === 0) {
                        canvasCtx.beginPath();
                        canvasCtx.arc(pts[i].x, pts[i].y, 3, 0, 2 * Math.PI);
                        canvasCtx.fillStyle = 'white';
                        canvasCtx.fill();
                    }
                }
            }
        }
    </script>
</body>
</html>
