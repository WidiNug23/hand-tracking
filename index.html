<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Geometry & Comet Trail Web</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 3/4;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Efek cermin */
        }
        #status {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 10;
            pointer-events: none;
        }
    </style>

    <!-- Memuat Library MediaPipe Hands CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="container">
        <div id="status">Memuat Kamera & MediaPipe...</div>
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusElement = document.getElementById('status');

        const FINGER_TIPS = [4, 8, 12, 16, 20];
        let trailHistoryLeft = {0: [], 1: [], 2: [], 3: [], 4: []};
        let trailHistoryRight = {0: [], 1: [], 2: [], 3: [], 4: []};

        const COLORS = [
            'rgb(0, 0, 255)',    // Merah (Format RGB untuk canvas)
            'rgb(255, 0, 0)',    // Biru
            'rgb(0, 255, 255)',  // Kuning
            'rgb(0, 255, 0)',    // Hijau
            'rgb(255, 0, 255)'   // Magenta
        ];

        function onResults(results) {
            canvasElement.width = videoElement.videoWidth || 640;
            canvasElement.height = videoElement.videoHeight || 480;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // Gambar frame video asli
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            let landmarksLeft = null;
            let landmarksRight = null;
            let numHands = 0;

            if (results.multiHandLandmarks && results.multiHandedness) {
                numHands = results.multiHandLandmarks.length;
                for (let i = 0; i < numHands; i++) {
                    const classification = results.multiHandedness[i].classification[0].label;
                    // MediaPipe mendeteksi secara mirror, sesuaikan label
                    const handLabel = classification === 'Left' ? 'Right' : 'Left';
                    const landmarks = results.multiHandLandmarks[i];

                    let tipDict = {};
                    FINGER_TIPS.forEach((tipIdx, idx) => {
                        const x = landmarks[tipIdx].x * canvasElement.width;
                        const y = landmarks[tipIdx].y * canvasElement.height;
                        tipDict[idx] = {x, y};

                        // Update riwayat komet
                        if (handLabel === 'Left') {
                            if (!trailHistoryLeft[idx]) trailHistoryLeft[idx] = [];
                            trailHistoryLeft[idx].unshift({x, y});
                            if (trailHistoryLeft[idx].length > 12) trailHistoryLeft[idx].pop();
                        } else {
                            if (!trailHistoryRight[idx]) trailHistoryRight[idx] = [];
                            trailHistoryRight[idx].unshift({x, y});
                            if (trailHistoryRight[idx].length > 12) trailHistoryRight[idx].pop();
                        }
                    });

                    if (handLabel === 'Left') landmarksLeft = tipDict;
                    else landmarksRight = tipDict;
                }
            }

            // --- Skenario Dua Tangan (4 Sisi Berbeda Warna) ---
            if (landmarksLeft && landmarksRight) {
                statusElement.innerText = "Dua Tangan Aktif (4 Sisi Berbeda)";
                let availableIndices = [0, 1, 2, 3, 4]; // Cukup ambil 5 ujung jari

                const sideColors = [
                    'rgba(255, 0, 0, 0.4)',     // Merah
                    'rgba(0, 0, 255, 0.4)',     // Biru
                    'rgba(0, 255, 255, 0.4)',   // Kuning
                    'rgba(0, 255, 0, 0.4)'      // Hijau
                ];

                for (let i = 0; i < availableIndices.length - 1; i++) {
                    let idx1 = availableIndices[i];
                    let idx2 = availableIndices[i+1];

                    if (landmarksLeft[idx1] && landmarksLeft[idx2] && landmarksRight[idx1] && landmarksRight[idx2]) {
                        canvasCtx.beginPath();
                        canvasCtx.moveTo(landmarksLeft[idx1].x, landmarksLeft[idx1].y);
                        canvasCtx.lineTo(landmarksLeft[idx2].x, landmarksLeft[idx2].y);
                        canvasCtx.lineTo(landmarksRight[idx2].x, landmarksRight[idx2].y);
                        canvasCtx.lineTo(landmarksRight[idx1].x, landmarksRight[idx1].y);
                        canvasCtx.closePath();

                        canvasCtx.fillStyle = sideColors[i % sideColors.length];
                        canvasCtx.fill();
                        canvasCtx.strokeStyle = 'white';
                        canvasCtx.lineWidth = 1.5;
                        canvasCtx.stroke();
                    }
                }
            } else if (landmarksLeft || landmarksRight) {
                statusElement.innerText = "Satu Tangan Aktif";
                let activeHand = landmarksLeft || landmarksRight;
                
                canvasCtx.beginPath();
                let keys = Object.keys(activeHand).sort();
                keys.forEach((k, index) => {
                    let pt = activeHand[k];
                    if (index === 0) canvasCtx.moveTo(pt.x, pt.y);
                    else canvasCtx.lineTo(pt.x, pt.y);
                });
                canvasCtx.closePath();
                canvasCtx.fillStyle = 'rgba(255, 0, 255, 0.4)';
                canvasCtx.fill();
                canvasCtx.strokeStyle = 'white';
                canvasCtx.lineWidth = 1.5;
                canvasCtx.stroke();
            } else {
                statusElement.innerText = "Arahkan tangan ke kamera HP...";
            }

            // Gambar Ekor Komet dengan Efek Fade
            drawCometTrails(trailHistoryLeft);
            drawCometTrails(trailHistoryRight);

            canvasCtx.restore();
        }

        function drawCometTrails(historyDict) {
            for (let idx in historyDict) {
                let pts = historyDict[idx];
                for (let i = 0; i < pts.length - 1; i++) {
                    let progress = i / pts.length;
                    let alpha = 0.8 * (1.0 - progress);
                    let thickness = Math.max(1, 5 * (1.0 - progress));

                    canvasCtx.beginPath();
                    canvasCtx.moveTo(pts[i].x, pts[i].y);
                    canvasCtx.lineTo(pts[i+1].x, pts[i+1].y);
                    canvasCtx.strokeStyle = `rgba(0, 255, 255, ${alpha})`;
                    canvasCtx.lineWidth = thickness;
                    canvasCtx.lineCap = 'round';
                    canvasCtx.stroke();
                }
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });

        camera.start().catch(err => {
            statusElement.innerText = "Gagal mengakses kamera: " + err;
        });
    </script>
</body>
</html>
