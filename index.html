<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Geometry & Smooth Comet (Auto-Split)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 4/3;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        #status {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 10;
        }
    </style>

    <!-- Memuat Library MediaPipe Hands & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="container">
        <div id="status">Memuat Kamera & AI...</div>
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusElement = document.getElementById('status');

        const FINGER_TIPS = [4, 8, 12, 16, 20]; // Ibu jari, Telunjuk, Tengah, Manis, Kelingking
        
        let trailHistory1 = {0: [], 1: [], 2: [], 3: [], 4: []};
        let trailHistory2 = {0: [], 1: [], 2: [], 3: [], 4: []};
        let isRunningAI = false;

        const hands = new Hands({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.4,
            minTrackingConfidence: 0.4
        });

        hands.onResults(results => {
            isRunningAI = false; 
            try {
                renderFrame(results);
            } catch (err) {
                console.error("Render error:", err);
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                if (videoElement.readyState >= 2) {
                    if (canvasElement.width !== videoElement.videoWidth || canvasElement.height !== videoElement.videoHeight) {
                        canvasElement.width = videoElement.videoWidth || 640;
                        canvasElement.height = videoElement.videoHeight || 480;
                    }

                    if (!isRunningAI) {
                        isRunningAI = true;
                        await hands.send({ image: videoElement }).catch((err) => {
                            console.error("AI send error:", err);
                            isRunningAI = false;
                        });
                    }
                }
            },
            width: 640,
            height: 480
        });

        camera.start()
            .then(() => {
                statusElement.innerText = "Arahkan tangan ke kamera...";
            })
            .catch(err => {
                statusElement.innerText = "Gagal akses kamera: " + err;
            });

        function renderFrame(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            if (results.image) {
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            }

            let detectedHands = [];

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                    const landmarks = results.multiHandLandmarks[i];
                    let tipDict = {};
                    let avgX = 0;

                    FINGER_TIPS.forEach((tipIdx, idx) => {
                        const x = landmarks[tipIdx].x * canvasElement.width;
                        const y = landmarks[tipIdx].y * canvasElement.height;
                        tipDict[idx] = {x, y};
                        avgX += x;
                    });
                    avgX /= FINGER_TIPS.length;

                    detectedHands.push({ avgX, tips: tipDict });
                }

                // Urutkan tangan berdasarkan posisi X di layar (Kiri vs Kanan)
                detectedHands.sort((a, b) => a.avgX - b.avgX);
            }

            let leftHandTips = detectedHands.length > 0 ? detectedHands[0].tips : null;
            let rightHandTips = detectedHands.length > 1 ? detectedHands[1].tips : null;

            // Update Riwayat Ekor Komet (Trail)
            updateTrail(leftHandTips, trailHistory1);
            updateTrail(rightHandTips, trailHistory2);

            // LOGIKA GEOMETRI UTAMA
            if (leftHandTips && rightHandTips) {
                statusElement.innerText = "Dual-Hand Geometry Active (2 Tangan)";
                let indices = [0, 1, 2, 3, 4];
                let sideColors = [
                    'rgba(0, 100, 255, 0.45)',    
                    'rgba(255, 0, 100, 0.45)',    
                    'rgba(0, 255, 200, 0.45)',  
                    'rgba(100, 255, 0, 0.45)'     
                ];

                // Hubungkan sisi antar titik jari kedua tangan
                for (let i = 0; i < indices.length - 1; i++) {
                    let i1 = indices[i], i2 = indices[i+1];
                    
                    canvasCtx.beginPath();
                    canvasCtx.moveTo(leftHandTips[i1].x, leftHandTips[i1].y);
                    canvasCtx.lineTo(leftHandTips[i2].x, leftHandTips[i2].y);
                    canvasCtx.lineTo(rightHandTips[i2].x, rightHandTips[i2].y);
                    canvasCtx.lineTo(rightHandTips[i1].x, rightHandTips[i1].y);
                    canvasCtx.closePath();
                    
                    canvasCtx.fillStyle = sideColors[i % sideColors.length];
                    canvasCtx.fill();
                    canvasCtx.strokeStyle = '#ffffff';
                    canvasCtx.lineWidth = 2;
                    canvasCtx.stroke();
                }
            } 
            else if (leftHandTips || rightHandTips) {
                statusElement.innerText = "Single-Hand Geometry Active (1 Tangan)";
                let hand = leftHandTips || rightHandTips;
                
                canvasCtx.beginPath();
                Object.keys(hand).sort().forEach((k, idx) => {
                    let pt = hand[k];
                    if (idx === 0) canvasCtx.moveTo(pt.x, pt.y);
                    else canvasCtx.lineTo(pt.x, pt.y);
                });
                canvasCtx.closePath();
                
                canvasCtx.fillStyle = 'rgba(255, 0, 255, 0.4)';
                canvasCtx.fill();
                canvasCtx.strokeStyle = '#ffffff';
                canvasCtx.lineWidth = 2;
                canvasCtx.stroke();
            } else {
                statusElement.innerText = "Arahkan tangan ke kamera...";
                // Kosongkan riwayat jika tidak ada tangan
                clearTrail(trailHistory1);
                clearTrail(trailHistory2);
            }

            drawSmoothCometTrails(trailHistory1);
            drawSmoothCometTrails(trailHistory2);

            canvasCtx.restore();
        }

        function updateTrail(handTips, historyDict) {
            if (!handTips) {
                clearTrail(historyDict);
                return;
            }
            for (let idx in handTips) {
                let pt = handTips[idx];
                if (!historyDict[idx]) historyDict[idx] = [];
                historyDict[idx].unshift({x: pt.x, y: pt.y});
                if (historyDict[idx].length > 12) historyDict[idx].pop();
            }
        }

        function clearTrail(historyDict) {
            for (let idx in historyDict) {
                if (historyDict[idx].length > 0) historyDict[idx].pop();
            }
        }

        function drawSmoothCometTrails(historyDict) {
            for (let idx in historyDict) {
                let pts = historyDict[idx];
                if (pts.length < 2) continue;

                for (let i = 0; i < pts.length - 1; i++) {
                    let progress = i / pts.length;
                    let alpha = 0.8 * (1.0 - progress);
                    let thickness = Math.max(1, 5 * (1.0 - progress));

                    canvasCtx.beginPath();
                    canvasCtx.moveTo(pts[i].x, pts[i].y);
                    canvasCtx.lineTo(pts[i+1].x, pts[i+1].y);
                    canvasCtx.strokeStyle = `rgba(0, 255, 255, ${alpha})`;
                    canvasCtx.lineWidth = thickness;
                    canvasCtx.lineCap = 'round';
                    canvasCtx.stroke();
                }
            }
        }
    </script>
</body>
</html>
